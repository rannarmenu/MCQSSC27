<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d35">
<meta name="description" content="SSC 2027 বাংলা ১ম পত্র প্রস্তুতির জন্য ৫০০টি অনুশীলন MCQ, অধ্যায়ভিত্তিক কুইজ, ব্যাখ্যাসহ উত্তর ও অগ্রগতি ট্র্যাকিং।">
<title>SSC 2027 বাংলা ১ম পত্র | MCQ প্রস্তুতি</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f2e9;color:#173d35;display:grid;min-height:100vh;place-items:center;margin:0;padding:24px}.load{width:min(100%,520px);padding:36px 28px;text-align:center;background:#fffefa;border:1px solid #e4e6dc;border-radius:24px;box-shadow:0 20px 70px #183d3515}h1{font-size:clamp(1.4rem,4vw,1.9rem);margin:18px 0 10px}p{line-height:1.8;color:#52655e}.spinner{width:36px;height:36px;margin:0 auto;border:3px solid #d8e6dd;border-top-color:#24745f;border-radius:50%;animation:spin .85s linear infinite}.status{font-size:.92rem;overflow-wrap:anywhere}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main class="load">
<div class="spinner" aria-hidden="true"></div>
<h1>প্রস্তুতি লোড হচ্ছে…</h1>
<p id="status" class="status" aria-live="polite">SSC 2027 · বাংলা ১ম পত্রের অনুশীলন প্রস্তুত করা হচ্ছে।</p>
</main>
<script>
(async()=>{
 const files=[
 "offline-preview.part1.b64","offline-preview.part2.b64","offline-preview.part3.b64","offline-preview.part4.b64","offline-preview.part5.b64",
 "site-payload-06a.b64","site-payload-06b.b64","site-payload-07a.b64","site-payload-08.b64"
 ];
 const status=document.getElementById("status");
 try{
  const parts=await Promise.all(files.map(async file=>{
   const response=await fetch(file,{cache:"no-store"});
   if(!response.ok)throw new Error("ডেটা ফাইল পাওয়া যায়নি: "+file);
   return (await response.text()).trim();
  }));
  const b64=parts.join("");
  if(b64.length!==54716)throw new Error("অসম্পূর্ণ ডেটা: "+b64.length+" অক্ষর");
  const binary=atob(b64);
  const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
  if(!("DecompressionStream" in window))throw new Error("এই ব্রাউজারে gzip খোলার সুবিধা নেই। Chrome-এর আপডেটেড সংস্করণ ব্যবহার করুন।");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  if(!html.includes("প্রস্তুতি")||!html.includes("500"))throw new Error("ওয়েবসাইটের কনটেন্ট যাচাই করা যায়নি।");
  const refinement = String.raw\`<style id="design-refinement">
:root{--forest:#163e35;--forest-2:#225b4a;--ink:#1d3029;--muted:#77857d;--line:#e3ebe5;--soft:#f5f8f5;--mint:#e3f4e9;--gold:#f0d48e;--paper:#fff;--shadow:0 20px 54px rgba(24,61,48,.075)}
html{scroll-padding-top:92px}
body{background:radial-gradient(ellipse at 8% 0%,#eaf3ec 0,transparent 28rem),#f5f7f4;color:var(--ink);letter-spacing:.01em}
.topbar{position:sticky;top:0;z-index:40;height:74px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(221,232,223,.88);box-shadow:0 4px 22px rgba(27,58,43,.035)}
.brand-mark{border-radius:13px;box-shadow:0 8px 20px rgba(23,61,53,.2)}
.syllabus-chip{border:1px solid #deeee2}
.page-shell{max-width:1280px}
.hero{background:linear-gradient(123deg,#123b32 0%,#1b5142 62%,#286650 100%);box-shadow:0 22px 48px rgba(22,62,53,.13);border:1px solid rgba(255,255,255,.11);isolation:isolate}
.hero:after{content:"";position:absolute;inset:auto auto -180px -130px;width:360px;height:360px;border:1px solid rgba(246,221,155,.17);border-radius:50%;z-index:-1}
.hero h1{letter-spacing:-.6px}
.hero-actions .btn{background:linear-gradient(135deg,#f7e2a4,#efcf79);box-shadow:0 8px 20px rgba(6,31,24,.16);transition:transform .2s,box-shadow .2s}
.hero-actions .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(6,31,24,.22)}
.score-card{box-shadow:0 28px 62px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.65)}
.stats-grid{gap:14px}
.stat-card{border-color:#e5ece6;border-radius:18px;box-shadow:0 7px 20px rgba(35,61,46,.035);transition:transform .2s,box-shadow .2s,border-color .2s}
.stat-card:hover{transform:translateY(-3px);border-color:#cbded0;box-shadow:0 13px 28px rgba(35,61,46,.08)}
.stat-icon{border-radius:12px}
.workspace{gap:22px}
.sidebar,.main-panel{border-color:#e5ece6;border-radius:21px;box-shadow:0 12px 34px rgba(28,59,43,.045)}
.sidebar{top:92px}
.main-panel{padding:32px;min-height:640px}
.side-heading h2,.section-heading h2{letter-spacing:-.2px}
.control{transition:border-color .18s,box-shadow .18s;background:#fcfdfc}
.control:focus{border-color:#5e9b76;box-shadow:0 0 0 4px rgba(47,130,101,.1)}
.filter-btn,.collection-btn{transition:background .16s,color .16s,transform .16s}
.filter-btn:hover{background:#f3f8f3;color:#245640}
.filter-btn.active{box-shadow:inset 3px 0 #438663}
.setup-card{background:linear-gradient(180deg,#fff,#fdfefd);border-color:#e3ebe4;box-shadow:0 5px 18px rgba(30,57,42,.025)}
.count-choice{transition:background .16s,border-color .16s,transform .16s,box-shadow .16s}
.count-choice:hover{transform:translateY(-2px);border-color:#a9cbb2}
.count-choice.active{box-shadow:inset 0 0 0 1px #52936e,0 5px 14px rgba(58,122,81,.08)}
.btn{border-radius:12px;transition:transform .18s,box-shadow .18s,background .18s}
.btn:active{transform:translateY(0) scale(.985)}
.btn-primary{background:linear-gradient(135deg,#1a4b3e,#245d4c)}
.question-card{border-color:#e0e9e2;box-shadow:0 10px 28px rgba(30,58,42,.035)}
.question-card h3{line-height:1.7;letter-spacing:0}
.options-list{gap:9px}
.option-btn{border-radius:13px!important;transition:border-color .16s,background .16s,transform .16s,box-shadow .16s}
.option-btn:hover{transform:translateY(-1px);box-shadow:0 4px 13px rgba(28,60,43,.05)}
.option-btn:focus-visible{outline:3px solid #8fbea0;outline-offset:2px}
.option-letter{border-radius:9px}
.feedback{border-radius:13px;line-height:1.8}
.progress-track{height:7px;border-radius:99px;overflow:hidden;background:#e8eee9}
.progress-track>*{border-radius:99px}
.searchbox{border-radius:14px;box-shadow:0 8px 24px rgba(27,58,41,.045)}
.search-result{border-radius:12px}
.result-score,.result-metrics{border-radius:17px}
.footer{border-top:1px solid #e3eae4;margin-top:28px}
.source-dialog{border:1px solid #e0e9e2;border-radius:22px;box-shadow:0 25px 85px rgba(15,43,30,.24)}
.source-dialog::backdrop{background:rgba(13,37,29,.48);backdrop-filter:blur(4px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline-color:#6baf85}
@media(max-width:1000px){.main-panel{padding:25px}.workspace{gap:16px}}
@media(max-width:760px){
 .topbar{height:66px;backdrop-filter:blur(14px)}
 .page-shell{padding:0 13px}
 .hero{background:linear-gradient(145deg,#123b32 0%,#1b5142 68%,#286650 100%);box-shadow:0 15px 35px rgba(22,62,53,.12)}
 .hero h1{letter-spacing:-.3px}
 .hero-visual{margin-top:18px}
 .stats-grid{gap:9px}
 .stat-card:hover{transform:none}
 .sidebar,.main-panel{border-radius:17px}
 .sidebar{box-shadow:0 7px 18px rgba(28,59,43,.035)}
 .main-panel{padding:18px 14px;min-height:0}
 .section-heading{gap:9px}
 .question-card{box-shadow:0 6px 19px rgba(30,58,42,.035)}
 .option-btn:hover{transform:none;box-shadow:none}
 .footer{margin-top:18px}
}
@media(max-width:360px){.hero{padding:25px 18px 20px}.hero h1{font-size:29px}.main-panel{padding:15px 11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>\`;
  const enhanced=html.replace(/<\\/head>/i,refinement+"\\n</head>").replace(/<title>[^<]*<\\/title>/i,"<title>SSC 2027 বাংলা ১ম পত্র | MCQ প্রস্তুতি</title>");
  if(!enhanced.includes("design-refinement"))throw new Error("ডিজাইন স্টাইল যোগ করা যায়নি।");
  document.open();document.write(enhanced);document.close();
 }catch(error){
  status.textContent="সাইটটি লোড করা যায়নি। "+(error&&error.message?error.message:String(error))+" — GitHub Pages চালু আছে কি না এবং সব ডেটা ফাইল আপলোড হয়েছে কি না যাচাই করুন।";
  const spinner=document.querySelector(".spinner");if(spinner)spinner.style.display="none";
 }
})();
</script>
</body>
</html>
